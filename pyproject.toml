[project]
name = "biological-knowledge-retrieval-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.12.6",
    "groq>=1.5.0",
    "huggingface-hub>=1.22.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2,<3",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8,<9",
]
